<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Proyek - Modul 4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; color: #0f172a; padding: 30px 15px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 12px rgba(15, 23, 42, .08); }
        h1 { color: #1e3a8a; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: #64748b; margin-bottom: 22px; font-size: 14px; }
        h2 { color: #1e3a8a; font-size: 18px; margin-bottom: 15px; }
        .panel { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field.full { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: 600; color: #334155; }
        input[type="text"], input[type="number"], input[type="search"], select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 14px; color: #0f172a; }
        input:focus, select:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
        .checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 14px; }
        .checkbox-row input { width: 16px; height: 16px; }
        .btn { border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-primary { background: #1e3a8a; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-warning { background: #fef3c7; color: #92400e; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; text-align: center; }
        .stat-card h3 { font-size: 12px; color: #64748b; text-transform: uppercase; margin-bottom: 7px; }
        .stat-card p { font-size: 21px; font-weight: bold; color: #1e3a8a; overflow-wrap: anywhere; }
        .filter-group { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .btn-filter { padding: 8px 13px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .btn-filter.active, .btn-filter:hover { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
        .search-wrap { margin-bottom: 20px; }
        .search-wrap label { display: block; margin-bottom: 7px; }
        .project-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 15px; background: #fff; }
        .project-info { min-width: 0; }
        .project-info h4 { font-size: 16px; color: #0f172a; margin: 5px 0; overflow-wrap: anywhere; }
        .project-category { display: inline-block; font-size: 12px; color: #0369a1; background: #e0f2fe; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
        .project-budget { font-size: 14px; color: #334155; font-weight: 600; margin-top: 6px; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef9c3; color: #854d0e; }
        .project-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; }
        .empty-state { text-align: center; color: #64748b; padding: 24px 12px; background: #f8fafc; border-radius: 8px; }
        .message { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px; }
        .message.error { display: block; color: #991b1b; background: #fee2e2; }
        .message.success { display: block; color: #166534; background: #dcfce7; }
        @media (max-width: 620px) {
            body { padding: 14px 8px; }
            .container { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
            .stats-grid { grid-template-columns: 1fr; }
            .project-card { align-items: flex-start; flex-direction: column; }
            .project-actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Portofolio Proyek</h1>
        <p class="subtitle">Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM</p>

        <section class="panel">
            <h2>Tambah Proyek Baru</h2>
            <form id="project-form">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="project-title">Judul Proyek</label>
                        <input type="text" id="project-title" name="title" placeholder="Contoh: Aplikasi Perpustakaan" required>
                    </div>
                    <div class="form-field">
                        <label for="project-category">Kategori</label>
                        <select id="project-category" name="category" required>
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="project-budget">Estimasi Anggaran (Rp)</label>
                        <input type="number" id="project-budget" name="budget" min="1" step="1" placeholder="Contoh: 2500000" required>
                    </div>
                    <div class="form-field">
                        <label class="checkbox-row" for="project-completed">
                            <input type="checkbox" id="project-completed" name="completed">
                            Sudah Selesai
                        </label>
                    </div>
                    <div class="form-field full">
                        <button class="btn btn-primary" type="submit">Tambah Proyek</button>
                        <p id="form-message" class="message" role="status" aria-live="polite"></p>
                    </div>
                </div>
            </form>
        </section>

        <section class="stats-grid" aria-label="Statistik proyek">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>
            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </section>

        <section aria-label="Daftar proyek">
            <h2>Daftar Proyek</h2>
            <div class="filter-group" aria-label="Filter kategori">
                <button type="button" class="btn-filter active" data-category="Semua">Semua Proyek</button>
                <button type="button" class="btn-filter" data-category="Web App">Web App</button>
                <button type="button" class="btn-filter" data-category="Desktop App">Desktop App</button>
                <button type="button" class="btn-filter" data-category="Mobile App">Mobile App</button>
                <button type="button" class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
            </div>
            <div class="search-wrap">
                <label for="project-search">Cari nama proyek</label>
                <input type="search" id="project-search" placeholder="Ketik nama proyek yang ingin dicari...">
            </div>
            <div id="project-list" aria-live="polite"></div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
